# Reverse proxy nginx pour LiveChat, avec une adresse fixe (livechat.tondomaine.fr
# a remplacer par ton propre domaine). Le serveur Node ecoute uniquement en
# local (PORT=8787 par defaut, cf. .env) ; nginx est le seul a etre expose sur
# internet, et gere le TLS.
#
# Installation : copie ce fichier dans /etc/nginx/sites-available/livechat,
# puis `ln -s /etc/nginx/sites-available/livechat /etc/nginx/sites-enabled/`.
# Genere le certificat avant d'activer le bloc HTTPS ci-dessous :
#   certbot certonly --nginx -d livechat.tondomaine.fr

server {
    listen 80;
    listen [::]:80;
    server_name livechat.tondomaine.fr;

    # Redirige tout vers HTTPS, une fois le certificat obtenu.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livechat.tondomaine.fr;

    ssl_certificate     /etc/letsencrypt/live/livechat.tondomaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livechat.tondomaine.fr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;

        # Indispensable : sans ca, nginx traite la connexion comme du HTTP
        # classique et le websocket (donc tout l'overlay) ne fonctionne pas.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Connexions longues (toute une soiree) : le timeout par defaut de
        # nginx (60s) couperait un overlay reste inactif sans meme.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
