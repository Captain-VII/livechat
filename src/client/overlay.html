<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Le seul contenu distant autorise, ce sont les images et videos que le bot
     envoie. Pas de script distant, pas d'eval. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data:; media-src https: data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>LiveChat</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* Le fond transparent, c'est ce qui laisse voir le bureau derriere. */
    background: transparent;
    /* Ceinture et bretelles : la fenetre est deja traversee par les clics. */
    pointer-events: none;
    user-select: none;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #scene {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Plus de cadre : le media et le texte flottent directement sur le bureau.
     Une ombre portee (et non une box-shadow de carte) fait le travail de
     detachement du fond, en epousant la silhouette reelle du media. */
  .contenu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    max-width: 80vw;
  }

  /* Le media et son eventuel sous-titre : un bloc positionne, qui se
     dimensionne exactement sur le media qu'il contient. */
  .media {
    position: relative;
    display: inline-block;
  }

  /* La taille reelle est calculee en JS : un meme doit remplir l'ecran, pas
     rester a sa taille native. Ces bornes ne sont qu'un filet de securite. */
  .media img,
  .media video {
    display: block;
    max-width: 72vw;
    max-height: 78vh;
    width: auto;
    height: auto;
    filter:
      drop-shadow(0 30px 55px rgba(0, 0, 0, .6))
      drop-shadow(0 6px 16px rgba(0, 0, 0, .55));
  }

  .legende {
    max-width: 70vw;
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    color: #fff;
    text-shadow: 0 6px 24px rgba(0, 0, 0, .85), 0 1px 4px rgba(0, 0, 0, .9);
    overflow-wrap: anywhere;
  }

  /* Quand il y a un media, le texte devient un sous-titre incruste dessus,
     plutot qu'une legende sous la feuille. */
  .media .legende {
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    width: 88%;
    max-width: none;
    margin: 0;
  }

  /* Le badge auteur : ancre dans le coin de l'ecran, independant du centrage
     du contenu (position:fixed le sort du flux flex de #scene). */
  .badge-auteur {
    position: fixed;
    top: 44px;
    left: 44px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .badge-auteur img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .15);
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .65));
  }

  .badge-auteur .pseudo {
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 4px 18px rgba(0, 0, 0, .85), 0 1px 4px rgba(0, 0, 0, .9);
  }

  /* Le bouton "passer" : contrairement au badge/a la legende, penses pour
     flotter sans fond, ici c'est un controle, il doit se voir comme
     cliquable. Coin oppose au badge auteur, meme logique position:fixed. */
  .bouton-passer {
    position: fixed;
    top: 44px;
    right: 44px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    color: #fff;
    cursor: pointer;
    pointer-events: auto;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .65));
  }

  /* La seule animation : une apparition nette, sans rotation ni fondu long —
     le meme et le badge auteur entrent legerement trop grands et se
     stabilisent d'un coup sec. */
  @keyframes apparaitre {
    from { opacity: 0; transform: scale(1.06); }
    to   { opacity: 1; transform: scale(1); }
  }

  .contenu,
  .badge-auteur,
  .bouton-passer {
    animation: apparaitre 300ms cubic-bezier(.15, .85, .25, 1) both;
  }

  @media (prefers-reduced-motion: reduce) {
    .contenu, .badge-auteur, .bouton-passer { animation: none; }
  }
</style>
</head>
<body>
  <div id="scene"></div>

  <script>
    const scene = document.getElementById('scene');
    let minuteur = null;
    let sortieAudio = null;

    // Seul un renderer sait enumerer les peripheriques audio. On passe la liste
    // au processus principal, qui en fait un menu, et il nous renvoie le choix.
    async function annoncerSorties() {
      try {
        const tous = await navigator.mediaDevices.enumerateDevices();
        window.livechat.annoncerSorties(
          tous
            .filter((d) => d.kind === 'audiooutput')
            .map((d) => ({ deviceId: d.deviceId, label: d.label })),
        );
      } catch (erreur) {
        console.error('[overlay] enumeration audio impossible :', erreur.name, erreur.message);
      }
    }

    /** Route le son d'un element vers la sortie choisie. */
    function router(media) {
      if (!sortieAudio || typeof media.setSinkId !== 'function') return;
      media.setSinkId(sortieAudio).catch((erreur) => {
        console.error('[overlay] sortie audio refusee :', erreur.name, erreur.message);
      });
    }

    navigator.mediaDevices?.addEventListener('devicechange', annoncerSorties);
    annoncerSorties();

    window.livechat.surSortieAudio((id) => {
      sortieAudio = id;
      // Le meme en cours suit tout de suite, sans attendre le suivant.
      scene.querySelectorAll('video').forEach(router);
    });

    // Un meme doit occuper l'ecran. On l'agrandit jusqu'a remplir la place
    // disponible, sans depasser 3x sa taille reelle : au-dela, une petite image
    // devient une bouillie de pixels.
    const PART_LARGEUR = 0.62;
    const PART_HAUTEUR = 0.72;
    const AGRANDISSEMENT_MAX = 3;

    function dimensionner(element, largeur, hauteur) {
      if (!largeur || !hauteur) return;
      const echelle = Math.min(
        (window.innerWidth * PART_LARGEUR) / largeur,
        (window.innerHeight * PART_HAUTEUR) / hauteur,
        AGRANDISSEMENT_MAX,
      );
      element.style.width = Math.round(largeur * echelle) + 'px';
      element.style.height = 'auto';
    }

    function tailleTexte(longueur) {
      if (longueur <= 24) return '7.5rem';
      if (longueur <= 60) return '5.5rem';
      if (longueur <= 140) return '3.6rem';
      return '2.6rem';
    }

    function retirer() {
      clearTimeout(minuteur);
      minuteur = null;
      // Filet de securite : si le curseur etait encore sur le bouton "passer"
      // au moment ou le meme disparait, on ne laisse pas la fenetre coincee
      // en mode "cliquable" alors qu'il n'y a plus rien a cliquer dessus.
      window.livechat.survolBoutonPasser(false);
      scene.replaceChildren();
    }

    function contenu(meme) {
      const el = document.createElement('div');
      el.className = 'contenu';

      // Avec un media, le texte devient un sous-titre incruste dessus (voir
      // .media .legende) : il est ajoute dans .media, pas dans .contenu.
      let media = null;

      if (meme.mediaUrl) {
        media = document.createElement('div');
        media.className = 'media';

        if (meme.mediaType === 'video') {
          const video = document.createElement('video');
          video.src = meme.mediaUrl;
          // Le serveur envoie desormais la duree reelle de la video (meme.duree) :
          // plus besoin de boucler, elle se termine d'elle-meme au bon moment.
          video.loop = false;
          video.playsInline = true;
          video.volume = meme.volume ?? 0;
          video.muted = !meme.volume;
          video.addEventListener('loadedmetadata', () => {
            dimensionner(video, video.videoWidth, video.videoHeight);
          });
          router(video);
          // autoplayPolicy est leve cote Electron ; si ca casse un jour, c'est ici
          // que ca se verra plutot que dans un silence inexplicable.
          video.play().catch((erreur) => {
            console.error('[overlay] lecture video refusee :', erreur.name, erreur.message);
          });
          media.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = meme.mediaUrl;
          img.alt = meme.text || 'meme';
          img.addEventListener('load', () => {
            dimensionner(img, img.naturalWidth, img.naturalHeight);
          });
          // Lien mort : le texte devient l'affiche plutot qu'un cadre vide.
          // Le sous-titre (s'il existe deja dans .media) revient alors dans
          // .contenu, en legende autonome agrandie.
          img.addEventListener('error', () => {
            console.warn('[overlay] image introuvable :', meme.mediaUrl);
            const sousTitre = media.querySelector('.legende');
            media.remove();
            if (sousTitre) {
              sousTitre.style.fontSize = tailleTexte(sousTitre.textContent.length);
              el.appendChild(sousTitre);
            } else {
              const rate = document.createElement('p');
              rate.className = 'legende';
              rate.textContent = 'image introuvable';
              rate.style.fontSize = tailleTexte(rate.textContent.length);
              el.appendChild(rate);
            }
          });
          media.appendChild(img);
        }

        el.appendChild(media);
      }

      if (meme.text) {
        const p = document.createElement('p');
        p.className = 'legende';
        p.textContent = meme.text;
        if (media) {
          // Sous-titre incruste sur le media.
          media.appendChild(p);
        } else {
          // Sur une affiche sans image, le texte porte tout : plus il est
          // court, plus il est gros.
          p.style.fontSize = tailleTexte(meme.text.length);
          el.appendChild(p);
        }
      }

      return el;
    }

    /** Le badge auteur : ancre dans le coin de l'ecran, separement du media. */
    function badgeAuteur(meme) {
      const el = document.createElement('div');
      el.className = 'badge-auteur';

      if (meme.author?.avatar) {
        const avatar = document.createElement('img');
        avatar.src = meme.author.avatar;
        avatar.alt = '';
        el.appendChild(avatar);
      }

      const pseudo = document.createElement('span');
      pseudo.className = 'pseudo';
      pseudo.textContent = meme.author?.name ?? 'anonyme';
      el.appendChild(pseudo);

      return el;
    }

    /** Le bouton "passer" : seule zone cliquable de toute la fenetre. */
    function boutonPasser() {
      const el = document.createElement('div');
      el.className = 'bouton-passer';
      el.textContent = '⏭';
      el.title = 'Passer ce meme';
      el.addEventListener('mouseenter', () => window.livechat.survolBoutonPasser(true));
      el.addEventListener('mouseleave', () => window.livechat.survolBoutonPasser(false));
      el.addEventListener('click', () => window.livechat.demanderPasser());
      return el;
    }

    // Un seul meme a l'ecran a la fois : le suivant remplace le precedent.
    window.livechat.surMeme((meme) => {
      clearTimeout(minuteur);
      scene.replaceChildren(contenu(meme), badgeAuteur(meme), boutonPasser());
      minuteur = setTimeout(retirer, meme.duree ?? 8000);
    });

    // Le process principal a cache la fenetre : on nettoie derriere lui.
    window.livechat.surRetrait(retirer);
  </script>
</body>
</html>
